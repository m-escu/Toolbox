; Toolbox Favorites & Configuration — EXAMPLE
; Copy to ToolboxFavorites.ini next to Toolbox.ahk and edit freely.
; The real INI is auto-created/managed at runtime.
; ============================================================
;
; [Settings]
;   WSCCRoot       — Path to WSCC folder (script scans Apps\ recursively)
;   ElevateMode    — warn (default) | auto (relaunch elevated via UAC when needed)
;   WarnNonAdmin   — 1 = warn when running admin commands non-elevated (default), 0 = silent
;   ConfirmRestart / ConfirmShutdown — 1 = confirm (default), 0 = skip
;
; [Tools] — External tool launchers (up to 50)
;   Search order: 1) Script\Tools\  2) WSCCRoot\Apps\ (recursive)  3) PathN
;
; [AddressFavorites] / [PortFavorites] / [MacFavorites] — quick-pick lists
; [IpProfiles] — saved static-IP configurations
; [CustomFolders] — custom folder shortcuts (LabelN/PathN)
; [Snippets] — hotstrings, SnippetN=trigger|expansion
; [RecentCommands] — auto-managed, do not edit
; ============================================================

[Settings]
WSCCRoot=C:\WSCC
ElevateMode=warn
WarnNonAdmin=1
ConfirmRestart=1
ConfirmShutdown=1
; NppPath=C:\Program Files\Notepad++\notepad++.exe
; HotkeyMenu=^+m
; HotkeyPalette=^+p
; HotkeyRerun=^+r
; HotkeyEditNpp=^+e
; HotkeyTerminal=^!t

[Tools]
; NirSoft (WSCC Apps\NirSoft Utilities\)
Label1=CurrPorts
Exe1=cports.exe

Label2=WirelessKeyView
Exe2=WifiInfoView.exe

Label3=HashMyFiles
Exe3=HashMyFiles.exe

; Sysinternals (WSCC Apps\SysInternals Suite\)
Label4=Process Explorer
Exe4=procexp64.exe

Label5=Process Monitor
Exe5=procmon64.exe

Label6=TCPView
Exe6=tcpview64.exe

; Other utilities (WSCC Apps\Other Utilities\)
Label7=Everything
Exe7=everything.exe

Label8=PuTTY
Exe8=putty.exe

Label9=PingInfoView
Exe9=PingInfoView.exe

Label10=LiveTcpUdpWatch
Exe10=LiveTcpUdpWatch.exe

Label11=WNetWatcher
Exe11=WNetWatcher.exe

Label12=RAMMap
Exe12=RAMMap64.exe

Label13=Autoruns
Exe13=Autoruns64.exe

; Tools installed elsewhere — set PathN to your install location
; Label14=Advanced IP Scanner
; Exe14=advanced_ip_scanner.exe
; Path14=C:\Program Files (x86)\Advanced IP Scanner\advanced_ip_scanner.exe

[AddressFavorites]
1=1.1.1.1

[CustomFolders]
; Label1=Scripts
; Path1=F:\Prog

[Snippets]
; Snippet1=;mail|me@example.com
